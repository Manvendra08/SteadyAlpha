# SteadyAlpha Configuration
# Spec Section 10
# v0.6.1 Professional

universe: "NIFTY500"

# --- Regime Engine ---
# Section 2 & 10.1
regime:
  # trend_score soft-cap scales (pct distance)
  ts_d20_scale: 0.05
  ts_d50_scale: 0.10
  ts_d200_scale: 0.20
  # EMA slope scales
  ts_slope20_scale: 0.005
  ts_slope50_scale: 0.002

  # Classification thresholds
  min_adx_trend: 18
  max_adx_range: 18
  min_trend_score: 3
  max_ts_range: 3
  min_bullish_breadth: 55
  max_bearish_breadth: 45
  range_breadth_low: 40
  range_breadth_high: 60

  # HIGH_VOL modifier
  high_vol_vix_abs: 20
  high_vol_vix_pct: 75

  # Hysteresis
  min_confirm_days: 2

# --- Flows Engine ---
# Section 3 & 10.2
flows:
  fii_z_strong: 1.0
  pcr_high_pct: 80
  pcr_low_pct: 20
  bias_threshold: 1.25
  min_sector_rs_spread: 0.010
  pcr_smooth_window: 3
  fii_lookback: 126
  pcr_lookback: 252
  rs_spread_lookback: 20

# --- Leadership Engine ---
# Section 4 & 10.3, Paper Trade Generation Tuning (v0.7.1)
leadership:
  w_rs_slope: 0.55
  w_volume_ratio: 0.25
  w_breakout: 0.20
  
  # Candidate Generation Thresholds (lower, discovery-mode)
  coverage_min_for_candidate_generation: 0.45
  candidate_score_min: 0.05
  volume_ratio_min_candidate: 1.00
  turnover_min_candidate_cr: 2
  
  # Paper Promotion Thresholds (higher, execution-mode)
  coverage_min_for_promotion: 0.60
  promotion_score_min: 0.18
  strong_promotion_score_min: 0.30
  volume_ratio_min_promotion: 1.15
  turnover_min_promotion_cr: 5
  
  # Engine tuning
  min_volume_ratio: 1.2
  min_turnover_inr: 50000000
  earnings_blackout_days: 5
  rs_lookback: 20
  vol_lookback: 20
  breakout_lookback: 20
  zscore_clip: 3.0

# --- Risk Engine ---
# Section 5 & 10.4
risk:
  account_risk_pct: 0.75
  atr_multiplier: 1.5
  max_stop_pct: 0.04
  max_position_size: 10000
  halt_session_loss_pct: 1.5
  halt_drawdown_pct: 6.0
  reduce_session_loss_pct: 1.0
  reduce_drawdown_pct: 4.0
  reduce_loss_streak: 3
  max_open_positions: 6
  max_sector_concentration_pct: 40
  corp_action_days: 2

# --- Decision Aggregator ---
# Section 6 & 10.5
advisor:
  w_regime: 0.35
  w_flows: 0.40
  w_leadership: 0.25
  min_leaders_for_vote: 1
  confidence_full: 0.65
  confidence_small: 0.40
  max_recommendations: 5
  mode: PAPER

# --- Candidate Scoring (Paper Trade Generation Tuning v0.7.1) ---
candidate_scoring:
  # Candidate score formula weights
  w_leadership_symbol_score: 0.40
  w_regime_alignment_score: 0.25
  w_volume_confirmation_score: 0.15
  w_flow_modifier_score: 0.10
  w_execution_context_score: 0.10
  
  # Promotion score formula weights (stricter than candidate)
  w_candidate_score: 0.35
  w_liquidity_quality_score: 0.20
  w_risk_sizing_fit: 0.15
  w_leadership_confidence: 0.15
  w_flow_confirmation: 0.15

# --- Backtest Defaults ---
# Section 9
backtest:
  stop_loss_multiplier: 1.5
  target_multiplier: 2.0
  max_holding_days: 10
  slippage_bps: 10
  commission_per_lot: 200

# --- Paper Execution (v0.7.1 - Paper Trade Generation Tuning) ---
paper_execution:
  tradable_regimes: ["BULLISH", "BEARISH", "VOLATILE_TREND", "RANGE"]
  min_confidence: 38.0
  require_risk_halt_false: True
  reference_capital: 1000000.0
  assumed_entry_price: 22500.0 # NIFTY proxy
  stop_loss_pct: 1.5
  
  # Paper mode states (Section 8)
  states:
    no_candidates: "NO_CANDIDATES"
    candidates_found: "CANDIDATES_FOUND"
    promotion_blocked: "PROMOTION_BLOCKED"
    paper_trades_created: "PAPER_TRADES_CREATED"
  
  # Empty state messages (Section 9)
  messages:
    no_candidates: "No paper trades — no leadership candidates generated"
    candidates_found_not_promoted: "No paper trades — candidates found, but promotion threshold not met"
    promotion_blocked_risk: "No paper trades — risk gate blocked promotion"
    promotion_blocked_flow: "No paper trades — contradictory flow blocked directional setup"

# --- Ingestion & Fallback Architecture (v0.7.0) ---
# Controls data source ladder behaviour, freshness thresholds, and sandbox mode.
ingestion:
  # Sandbox mode: set via env STEADYALPHA_SANDBOX_MODE=true
  # When true: run_validity always NO, paper promotion blocked, all synthetic → SIMULATED
  sandbox_mode_env_key: "STEADYALPHA_SANDBOX_MODE"

  # Adapter retry policy
  retry:
    max_attempts: 3
    base_delay_sec: 1.0
    timeout_sec: 20

  # Freshness thresholds — max age of cached snapshot before it is rejected
  freshness_ttl_hours:
    nifty_ohlcv:    24    # 1 trading day
    india_vix:      24
    fii_flows:      24
    dii_flows:      48
    pcr_oi:         12    # options chain stale faster
    options_chain:  12
    sector_indices: 24
    universe_ohlcv: 24
    equity_curve:   1     # must be near-realtime

  # Coverage thresholds — engines DEGRADE below these
  coverage:
    universe_min_symbols_pct: 0.50   # 50% of universe must have valid OHLCV
    universe_min_rows: 20            # minimum trading days of history

  # Critical datasets — MISSING any of these → run_validity=NO
  critical_for_decision:
    - nifty_ohlcv
    - india_vix
    - fii_flows
    - pcr_oi
    - universe_ohlcv

  critical_for_risk:
    - equity_curve

  # Non-critical — degrade but don't invalidate
  important_noncritical:
    - dii_flows
    - sector_indices
    - options_chain
